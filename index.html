<!DOCTYPE html>

        body { font-family: 'DM Sans', sans-serif; }
        .nav-link { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 8px; color: #57534e; font-weight: 500; cursor: pointer; transition: all 0.2s; margin-bottom: 4px; }

        .page-section { display: none; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .card-click { border: 1px solid #e7e5e4; border-radius: 12px; overflow: hidden; transition: all 0.2s; cursor: pointer; }
        .card-click:hover { transform: translateY(-4px); box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
        .quiz-opt { border: 1px solid #d6d3d1; background: white; padding: 12px 16px; border-radius: 8px; cursor: pointer; transition: 0.2s; margin-bottom: 10px; }
        .quiz-opt:hover { border-color: #a8a29e; }
        .quiz-opt.selected { border-color: #292524; background: #f5f5f4; font-weight: 600; }
        .quiz-opt.correct { border-color: #22c55e; background: #dcfce7; color: #15803d; }
        .quiz-opt.wrong { border-color: #ef4444; background: #fee2e2; color: #b91c1c; }
        .diagram-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; font-size: 80px; min-height: 260px; }

</head>
<body class="bg-white text-stone-800 h-screen flex overflow-hidden">

<aside class="w-64 bg-stone-50 border-r border-stone-200 flex flex-col shrink-0">
    <div class="p-5 border-b border-stone-200">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center text-white"><i data-lucide="globe" class="w-6 h-6"></i></div>
            <div><h1 class="font-bold text-lg text-stone-900">Pembentukan Bumi</h1><p class="text-xs text-stone-500">Modul Pembelajaran</p></div>
        </div>

    <nav class="flex-1 overflow-y-auto p-3" id="nav-menu"></nav>

<main class="flex-1 flex flex-col overflow-hidden">

    <div class="mt-6 p-4 bg-amber-50 rounded-lg border border-amber-200">

    </div>

<script>
const topics = [
    {id:0, title:'Selamat Datang', icon:'home'},
    {id:1, title:'Tujuan Pembelajaran', icon:'target'},
    {id:2, title:'Apa Itu Bumi?', icon:'globe'},
    {id:3, title:'Proses Pembentukan', icon:'layers'},
    {id:4, title:'Teori Nebula', icon:'cloud'},
    {id:5, title:'Teori Planetesimal', icon:'rocket'},
    {id:6, title:'Teori Pasang Surut', icon:'waves'},
    {id:7, title:'Teori Bintang Kembar', icon:'star'},
    {id:8, title:'Quiz', icon:'help-circle'},
    {id:9, title:'Penutup', icon:'trophy'}
];

let currentSection = 0;
let visited = new Set([0]);
let quizAnswers = {};
let quizScore = 0;

const funFacts = [
    "Bumi terbentuk sekitar 4,6 MILIAR tahun yang lalu dari awan debu dan gas!",
    "Usia Bumi sama dengan Matahari, yaitu sekitar 4,6 miliar tahun.",
    "Teori Nebula adalah teori paling diterima untuk menjelaskan asal Bumi.",
    "Bumi berputar pada sumbunya satu kali dalam 24 jam.",
    "70% permukaan Bumi ditutupi air.",
    "Bumi memiliki satelit alami yang disebut Bulan.",
    "Lapisan Bumi terdiri dari kerak, mantel, dan inti.",
    "Bumi adalah satu-satunya planet yang diketahui memiliki kehidupan."
];

function goToSection(id) {
    currentSection = id;
    visited.add(id);
    renderNav();
    renderSection(id);
    updateProgress();
    updatePipeline();
    updateStatus();
}

function renderNav() {
    const navMenu = document.getElementById('nav-menu');
    navMenu.innerHTML = '';
    topics.forEach((topic, index) => {
        const item = document.createElement('div');
        item.className = `nav-link ${index === currentSection ? 'active' : ''}`;
        item.onclick = () => goToSection(index);
        item.innerHTML = `<i data-lucide="${topic.icon}" style="width:18px;height:18px"></i><span>${topic.title}</span>`;
        navMenu.appendChild(item);
    });
    lucide.createIcons();
}

function updateProgress() {
    const progress = Math.round((visited.size / topics.length) * 100);
    document.getElementById('progress-text').textContent = progress + '%';
    document.getElementById('progress-bar').style.width = progress + '%';
}

function updatePipeline() {
    const pipelineList = document.getElementById('pipeline-list');
    pipelineList.innerHTML = '';
    topics.forEach((topic, index) => {
        if (index !== 8 && index !== 9) {
            const item = document.createElement('div');
            item.className = `text-xs p-2 rounded cursor-pointer transition ${visited.has(index) ? 'bg-blue-100 text-blue-700 font-medium' : 'bg-stone-100 text-stone-600'}`;
            item.textContent = `${index + 1}. ${topic.title}`;
            item.onclick = () => goToSection(index);
            pipelineList.appendChild(item);
        }
    });
}

function updateStatus() {
    const statusList = document.getElementById('status-list');
    statusList.innerHTML = '';
    const completedCount = visited.size - 1;
    const statuses = [
        { label: 'Selesai', value: completedCount, icon: '✓', color: 'green' },
        { label: 'Sisa', value: topics.length - visited.size, icon: '→', color: 'amber' }
    ];
    statuses.forEach(s => {
        const item = document.createElement('div');
        item.className = `text-xs p-2 rounded bg-${s.color}-100 text-${s.color}-700`;
        item.innerHTML = `<div class="font-bold">${s.value} ${s.label}</div>`;
        statusList.appendChild(item);
    });
}

function renderSection(id) {
    const c = document.getElementById('main-content');
    const randomFact = funFacts[Math.floor(Math.random() * funFacts.length)];
    document.getElementById('fun-fact').textContent = randomFact;
    
    let html = '';
    
    if(id===0) html = `<div class="max-w-3xl mx-auto">

            <div class="card-click p-4 bg-white" onclick="goToSection(2)"><div class="flex items-center justify-between mb-2"><span class="text-2xl">🌍</span><span class="text-xs bg-stone-100 px-2 py-1 rounded">Modul 1</span></div><p class="font-semibold text-stone-800">Apa Itu Bumi?</p></div>

        </div>
        <div class="flex justify-between"><button onclick="goToSection(0)" class="px-4 py-2 border border-stone-300 rounded-lg hover:bg-stone-50">← Sebelumnya</button><button onclick="goToSection(2)" class="px-4 py-2 bg-stone-900 text-white rounded-lg hover:bg-stone-700">Lanjut ke Materi →</button></div>

    if(id===2) html = `<div class="max-w-3xl mx-auto">
        <h2 class="text-2xl font-bold mb-4">🌍 Apa Itu Bumi?</h2>
        <img src="https://images.pexels.com/photos/9544066/pexels-photo-9544066.jpeg?auto=compress&cs=tinysrgb&w=800" class="w-full h-64 object-cover rounded-xl mb-6">

            <div class="flex items-start gap-4 p-4 bg-green-50 rounded-lg"><div class="w-8 h-8 bg-green-500 text-white rounded-full flex items-center justify-center font-bold shrink-0 text-sm">2</div><div><h4 class="font-bold text-stone-800">Pemadatan & Rotasi</h4><p class="text-sm text-stone-600">Awan debu berputar dan mulai menggumpal karena gaya gravitasi dari pusat nebula.</p></div></div>
            <div class="flex items-start gap-4 p-4 bg-yellow-50 rounded-lg"><div class="w-8 h-8 bg-yellow-500 text-white rounded-full flex items-center justify-center font-bold shrink-0 text-sm">3</div><div><h4 class="font-bold text-stone-800">Bola Api Raksasa</h4><p class="text-sm text-stone-600">Gumpalan semakin besar dan panas, membentuk bola api raksasa (protoplanet).</p></div></div>
            <div class="flex items-start gap-4 p-4 bg-purple-50 rounded-lg"><div class="w-8 h-8 bg-purple-500 text-white rounded-full flex items-center justify-center font-bold shrink-0 text-sm">4</div><div><h4 class="font-bold text-stone-800">Pendinginan Bertahap</h4><p class="text-sm text-stone-600">Perlahan mendingin membentuk kerak bumi yang padat dan berbagai lapisan planet.</p></div></div>
        </div>
        <div class="bg-amber-50 p-4 rounded-lg border border-amber-200 mb-6">
            <p class="text-sm text-amber-800"><strong>💡 Catatan:</strong> Usia Bumi yang kita ketahui saat ini adalah berdasarkan penelitian radiometrik pada batuan tertua di Bumi.</p>

        <div class="flex justify-between"><button onclick="goToSection(2)" class="px-4 py-2 border border-stone-300 rounded-lg hover:bg-stone-50">← Sebelumnya</button><button onclick="goToSection(4)" class="px-4 py-2 bg-stone-900 text-white rounded-lg hover:bg-stone-700">Teori Nebula →</button></div>
    </div>`;

    if(id===4) html = `<div class="max-w-3xl mx-auto">

function selectAnswer(questionNum, answer) {
    quizAnswers[questionNum] = answer;
    const correctAnswers = {0: 'B', 1: 'A', 2: 'B', 3: 'C', 4: 'B'};
    
    // Mark the selected answer
    const options = document.querySelectorAll(`.quiz-question[data-question="${questionNum}"] .quiz-opt`);
    options.forEach(opt => {
        opt.classList.remove('selected', 'correct', 'wrong');
        if(opt.textContent.startsWith(answer)) {
            if(answer === correctAnswers[questionNum]) {
                opt.classList.add('correct');
                if(!quizAnswers[questionNum + 100]) {
                    quizScore++;
                    quizAnswers[questionNum + 100] = true;
                }
            } else {
                opt.classList.add('wrong');
            }
            opt.classList.add('selected');
        }
    });

    // Show correct answer if wrong
    if(answer !== correctAnswers[questionNum]) {
        options.forEach(opt => {
            if(opt.textContent.startsWith(correctAnswers[questionNum])) {
                opt.classList.add('correct');
            }
        });
    }

    setTimeout(() => nextQuestion(questionNum), 1500);
}

function nextQuestion(currentQ) {
    if(currentQ < 4) {
        document.querySelectorAll('.quiz-question').forEach(q => q.classList.add('hidden'));
        document.querySelector(`.quiz-question[data-question="${currentQ + 1}"]`).classList.remove('hidden');
    } else {
        document.getElementById('quiz-container').innerHTML = `
            <div class="bg-gradient-to-r from-blue-500 to-purple-600 text-white p-8 rounded-lg text-center">
                <h3 class="text-3xl font-bold mb-2">🎉 Quiz Selesai!</h3>
                <p class="text-lg mb-6">Skor Anda: <span class="text-4xl font-bold">${quizScore}</span>/5</p>
                <div class="text-lg mb-6">
                    ${quizScore === 5 ? '🌟 Sempurna! Anda menguasai semua materi!' : 
                      quizScore >= 4 ? '🎯 Bagus! Hampir sempurna!' : 
                      quizScore >= 3 ? '✅ Cukup baik! Pelajari kembali materi yang belum jelas.' :
                      '📚 Silakan pelajari kembali materi dari awal.'}
                </div>
                <button onclick="resetQuiz()" class="px-6 py-2 bg-white text-blue-600 rounded-lg font-medium hover:bg-stone-100 transition mr-2">Ulangi Quiz</button>
                <button onclick="goToSection(9)" class="px-6 py-2 bg-stone-900 text-white rounded-lg font-medium hover:bg-stone-700 transition">Lanjut ke Penutup</button>
            </div>
        `;
    }
}

function resetQuiz() {
    quizScore = 0;
    quizAnswers = {};
    goToSection(8);
}

// Initialize
renderNav();
renderSection(0);
updateProgress();
updatePipeline();
updateStatus();
</script>

</body>
</html>
